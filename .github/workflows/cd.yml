name: Store CD

on:
  push:
    branches:
      - production
      - develop
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - 'ios/**'
      - 'macos/**'
      - 'linux/**'
      - 'windows/**'
      - 'assets/**'
      - '.fvmrc'
      - '.github/workflows/cd.yml'
      - '.github/scripts/**'
  workflow_dispatch:

env:
  flutter_version_file: '.fvmrc'
  java_version: '21'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: write
  pull-requests: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      version_code: ${{ steps.get_version_code.outputs.version_code }}
      is_production: ${{ github.ref == 'refs/heads/production' }}
    steps:
      - uses: actions/checkout@v4
      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      - name: Get version code and reserve the next build number
        id: get_version_code
        env:
          APP_VERSION: ${{ steps.get_version.outputs.version }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          STORED_VERSION_CODE: ${{ vars.VERSION_CODE }}
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "$APP_VERSION"
          if [[ ! "$MAJOR" =~ ^[0-9]+$ || ! "$MINOR" =~ ^[0-9]+$ ]]; then
            echo "Invalid app version: $APP_VERSION"
            exit 1
          fi
          if [[ ! "$STORED_VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "VERSION_CODE must be a positive integer"
            exit 1
          fi

          BASE=$((10#$MAJOR * 10000 + 10#$MINOR * 100))
          CURRENT=$((10#$STORED_VERSION_CODE))
          if (( CURRENT < BASE )); then
            CURRENT=$BASE
          fi
          NEXT=$((CURRENT + 1))
          echo "version_code=$CURRENT" >> $GITHUB_OUTPUT
          gh variable set VERSION_CODE --body "$NEXT" --repo "${{ github.repository }}"
          echo "Version $APP_VERSION uses build $CURRENT; reserved $NEXT for the next run"
      - name: Aggregate changelog from merged PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TYPE=${{ github.ref == 'refs/heads/production' && 'stable' || 'beta' }}
          bash "$GITHUB_WORKSPACE/.github/scripts/aggregate_changelog.sh" "$RELEASE_TYPE" changelog_aggregated.json
      - name: Upload aggregated changelog
        uses: actions/upload-artifact@v4
        with:
          name: changelog-aggregated
          path: changelog_aggregated.json
  deploy_android:
    name: Android Play Store
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.java_version }}
      - name: Decrypt Android keys
        run: sh ./.github/scripts/decrypt_android_keys.sh
        env:
          KEYS_SECRET_PASSPHRASE: ${{ secrets.KEYS_SECRET_PASSPHRASE }}
      - name: Download aggregated changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog-aggregated
      - name: Format changelog for Android
        run: bash "$GITHUB_WORKSPACE/.github/scripts/format_changelog.sh" android
        working-directory: ./android/fastlane
        env:
          AGGREGATED_CHANGELOG: ${{ github.workspace }}/changelog_aggregated.json
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: ${{ env.flutter_version_file }}
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
      - name: Install Flutter dependencies
        run: flutter pub get
      - run: flutter build appbundle --release --build-number=${{ needs.prepare.outputs.version_code }}
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install Ruby dependencies
        run: |
          bundle config set path vendor/bundle
          bundle install
        working-directory: ./android
      - name: Run Fastlane
        run: bundle exec fastlane ${{ needs.prepare.outputs.is_production == 'true' && 'playstore' || 'beta' }}
        working-directory: ./android

  deploy_ios:
    name: iOS Deploy TestFlight
    needs: prepare
    runs-on: [self-hosted, macOS]
    env:
      DEVELOPER_DIR: /Applications/Xcode-27.2.0.app/Contents/Developer
      CI_SIGNING_KEYCHAIN: ci-signing-${{ github.run_id }}-${{ github.run_attempt }}.keychain
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_API_ISSUER_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.java_version }}
      - name: Download aggregated changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog-aggregated
      - name: Format changelog for iOS
        run: bash "$GITHUB_WORKSPACE/.github/scripts/format_changelog.sh" ios
        working-directory: ./ios/fastlane
        env:
          AGGREGATED_CHANGELOG: ${{ github.workspace }}/changelog_aggregated.json
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: ${{ env.flutter_version_file }}
          channel: 'stable'
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
      - name: Install FlutterFire CLI
        run: |
          dart pub global activate flutterfire_cli 1.4.1
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Flutter Initialize
        run: flutter doctor -v
      # ruby/setup-ruby prebuilt Rubies are hardcoded to /Users/runner/hostedtoolcache on macOS,
      # which is not writable on this self-hosted runner, so use the preinstalled Homebrew Ruby.
      - name: Setup Ruby
        run: echo "/opt/homebrew/opt/ruby/bin" >> "$GITHUB_PATH"
      - name: Install Ruby dependencies
        run: |
          bundle config set path vendor/bundle
          bundle install
        working-directory: ./ios
      - name: Decode API Key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          umask 077
          printf '%s' "${APP_STORE_CONNECT_API_KEY_BASE64:?Missing App Store Connect API key}" | base64 --decode > ios/AuthKey.p8
      - name: Save runner keychain settings
        run: |
          ruby -rjson -ropen3 -rshellwords <<'RUBY'
          search_list, status = Open3.capture2("security", "list-keychains", "-d", "user")
          abort "Could not read the keychain search list" unless status.success?

          default, status = Open3.capture2("security", "default-keychain", "-d", "user")
          state = { search_list: Shellwords.split(search_list), default: status.success? ? Shellwords.split(default) : [] }
          path = File.join(ENV.fetch("RUNNER_TEMP"), "#{ENV.fetch("CI_SIGNING_KEYCHAIN")}.json")
          File.write(path, JSON.generate(state))
          RUBY
      - name: Prepare iOS signing
        working-directory: ./ios
        env:
          APP_STORE_CONNECT_BUNDLE_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_BUNDLE_IDENTIFIER }}
          DEVELOPER_PORTAL_TEAM_ID: ${{ secrets.DEVELOPER_PORTAL_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_PRIVATE_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
          GIT_SSH_COMMAND: ssh -o StrictHostKeyChecking=accept-new
        run: |
          umask 077
          MATCH_GIT_PRIVATE_KEY_PATH="$(mktemp "$RUNNER_TEMP/match-deploy-key.XXXXXX")"
          export MATCH_GIT_PRIVATE_KEY_PATH
          trap 'rm -f "$MATCH_GIT_PRIVATE_KEY_PATH"' EXIT
          printf '%s\n' "${MATCH_GIT_PRIVATE_KEY:?Missing MATCH_GIT_PRIVATE_KEY secret}" > "$MATCH_GIT_PRIVATE_KEY_PATH"
          unset MATCH_GIT_PRIVATE_KEY
          bundle exec fastlane ios signing key_id:"$KEY_ID" issuer_id:"$ISSUER_ID"
      - run: flutter build ipa --release --build-number=${{ needs.prepare.outputs.version_code }} --export-options-plist=ios/ExportOptions.plist
      - name: Zip dSYM
        run: zip Runner.app.dSYM.zip -r ../archive/Runner.xcarchive/dSYMs/
        working-directory: ./build/ios/ipa
      - name: Deploy iOS Beta to TestFlight via Fastlane
        run: bundle exec fastlane ios release key_id:"$KEY_ID" issuer_id:"$ISSUER_ID" app_version:"$APP_VERSION" build_number:"$BUILD_NUMBER"
        working-directory: ./ios
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.version_code }}
          APP_STORE_CONNECT_TEAM_ID: '${{ secrets.APP_STORE_CONNECT_TEAM_ID }}'
          APP_STORE_CONNECT_APPLE_ID: '${{ secrets.APP_STORE_CONNECT_APPLE_ID }}'
          APP_STORE_CONNECT_BUNDLE_IDENTIFIER: '${{ secrets.APP_STORE_CONNECT_BUNDLE_IDENTIFIER }}'
          DEVELOPER_PORTAL_TEAM_ID: '${{ secrets.DEVELOPER_PORTAL_TEAM_ID }}'
      - name: Clean up iOS signing
        if: always()
        run: |
          rm -f ios/AuthKey.p8 ios/ExportOptions.plist
          keychain="$HOME/Library/Keychains/$CI_SIGNING_KEYCHAIN"
          cleanup_status=0
          if [[ -f "$keychain-db" ]]; then
            security delete-keychain "$keychain-db" || cleanup_status=$?
          elif [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain" || cleanup_status=$?
          fi
          ruby -rjson <<'RUBY'
          path = File.join(ENV.fetch("RUNNER_TEMP"), "#{ENV.fetch("CI_SIGNING_KEYCHAIN")}.json")
          if File.file?(path)
            state = JSON.parse(File.read(path))
            search_list_restored = system("security", "list-keychains", "-d", "user", "-s", *state.fetch("search_list"))
            default_restored = system("security", "default-keychain", "-d", "user", "-s", *state.fetch("default"))
            File.delete(path)
            abort "Could not restore runner keychain settings" unless search_list_restored && default_restored
          end
          RUBY
          exit "$cleanup_status"

  deploy_windows:
    name: Windows App
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: ${{ env.flutter_version_file }}
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
      - name: Enable windows
        run: flutter config --enable-windows-desktop
      - run: flutter doctor -v
      - run: flutter pub get
      - name: Build windows
        run: flutter build windows --release --build-number=${{ needs.prepare.outputs.version_code }}
        env:
          # 新版 MSVC (VS18 / 14.51) 把 <experimental/coroutine> 從 warning 升成硬 error (STL1011)，
          # flutter_inappwebview_windows、gal 等 plugin 仍在使用。透過 CL 環境變數注入 silence macro，
          # 確保涵蓋所有 plugin 的編譯單元（與 ci.yml 一致）。
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
      - name: Zip files
        run: powershell Compress-Archive build\windows\x64\runner\Release\ windows.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: windows.zip

  github_release:
    name: Create GitHub Release
    needs: [prepare, deploy_android, deploy_ios, deploy_windows]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download aggregated changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog-aggregated
      - name: Format changelog for GitHub Release
        run: bash "$GITHUB_WORKSPACE/.github/scripts/format_changelog.sh" github
        env:
          AGGREGATED_CHANGELOG: ${{ github.workspace }}/changelog_aggregated.json
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-artifact
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}${{ github.ref != 'refs/heads/production' && '-beta' || '' }}+${{ needs.prepare.outputs.version_code }}
          name: v${{ needs.prepare.outputs.version }}${{ github.ref != 'refs/heads/production' && '-beta' || '' }}+${{ needs.prepare.outputs.version_code }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES_GENERATED.md
          draft: false
          prerelease: ${{ github.ref != 'refs/heads/production' }}
          files: windows.zip
