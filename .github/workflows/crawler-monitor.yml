name: Crawler Monitor

# Runs the nsysu_crawler live integration tests against the real NSYSU
# servers on a schedule. Failures identify the affected test group;
# test names alone do not establish a network or HTML parsing root cause.
#
# The Discord notification message labels which one fired so on-call can
# triage faster.
#
# Required secrets (set in repo Settings → Secrets and variables → Actions):
#   NSYSU_USERNAME      — student id used for credentialed live tests
#   NSYSU_PASSWORD      — corresponding password
#   DISCORD_WEBHOOK_URL — webhook posted to on failure
#
# Until the secrets are populated, credentialed tests will skip silently
# (their `skip:` clause checks for env vars) and only health checks +
# the no-creds bus tests run. That's enough to verify the workflow is
# wired correctly.

on:
  schedule:
    # 00:00 UTC = 08:00 Asia/Taipei
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  monitor:
    name: Crawler Structure Monitor
    runs-on: [self-hosted, macOS]
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Pub get (nsysu_crawler)
        id: dependencies
        working-directory: packages/nsysu_crawler
        run: dart pub get

      - name: Run authenticated live tests (selcrs / graduation / tuition)
        id: test_live
        working-directory: packages/nsysu_crawler
        env:
          NSYSU_USER: ${{ secrets.NSYSU_USERNAME }}
          NSYSU_PASS: ${{ secrets.NSYSU_PASSWORD }}
        run: |
          set +e
          dart test -P live -r expanded 2>&1 | tee ../../live_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          set -e

      - name: Run anonymous live tests (bus + health checks)
        id: test_anon
        working-directory: packages/nsysu_crawler
        run: |
          set +e
          dart test -P live-anonymous -r expanded 2>&1 | tee ../../anon_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          set -e

      - name: Classify failures
        if: always() && (steps.test_live.outputs.exit_code != '0' || steps.test_anon.outputs.exit_code != '0')
        id: msg
        env:
          SETUP_OUTCOME: ${{ steps.dependencies.outcome }}
          LIVE_EXIT: ${{ steps.test_live.outputs.exit_code }}
          ANON_EXIT: ${{ steps.test_anon.outputs.exit_code }}
        run: |
          if [ "$SETUP_OUTCOME" != success ]; then
            echo 'category=[ERROR] 監控環境設定失敗（checkout、Dart 或依賴安裝）' >> "$GITHUB_OUTPUT"
            echo 'failures=測試未執行，請查看 setup 步驟紀錄。' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$LIVE_EXIT" ] || [ -z "$ANON_EXIT" ]; then
            echo 'category=[ERROR] 測試執行未完成' >> "$GITHUB_OUTPUT"
            echo 'failures=缺少測試結果，請查看執行紀錄。' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Combine outputs from both presets
          cat live_output.txt anon_output.txt > combined_output.txt 2>/dev/null || true

          # Extract failed test names. dart test's expanded reporter marks
          # failures as `+N -M: <test name> [E]`.
          FAILED=$(grep -E '\[E\]' combined_output.txt \
            | sed 's/.*+[0-9]* -[0-9]*: //' \
            | sed 's/ \[E\]//' \
            | sort -u | head -20 || true)

          # Identify affected groups without guessing the underlying cause.
          HEALTH_FAIL=$(echo "$FAILED" | grep -i 'Health Check' || true)
          CRAWLER_FAIL=$(echo "$FAILED" | grep -iv 'Health Check' || true)

          if [ -n "$HEALTH_FAIL" ] && [ -n "$CRAWLER_FAIL" ]; then
            CATEGORY="[ERROR] 健康檢查與爬蟲測試失敗（原因請查看測試紀錄）"
          elif [ -n "$HEALTH_FAIL" ]; then
            CATEGORY="[ERROR] 健康檢查失敗（連線、HTTP 狀態或回應驗證，請查看測試紀錄）"
          else
            CATEGORY="[ERROR] 爬蟲測試失敗（登入、請求或資料驗證，請查看測試紀錄）"
          fi
          FAILED=${FAILED:-未找到失敗測試名稱，請查看測試載入或執行錯誤。}

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "category=$CATEGORY" >> "$GITHUB_OUTPUT"
          echo "failures<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$FAILED" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Generate Job Summary
        if: always()
        env:
          LIVE_EXIT: ${{ steps.test_live.outputs.exit_code }}
          ANON_EXIT: ${{ steps.test_anon.outputs.exit_code }}
          CATEGORY: ${{ steps.msg.outputs.category }}
          FAILURES: ${{ steps.msg.outputs.failures }}
        run: |
          echo "## [MONITOR] NSYSU Crawler Status Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$LIVE_EXIT" == "0" ] && [ "$ANON_EXIT" == "0" ]; then
            echo "### [PASS] Executed crawler tests passed (credentialed tests may be skipped)." >> $GITHUB_STEP_SUMMARY
          else
            echo "### [FAIL] Monitor failure detected." >> $GITHUB_STEP_SUMMARY
            echo "**Category:** ${CATEGORY:-監控未完成，請查看執行紀錄。}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### Failed Items:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            printf '%s\n' "$FAILURES" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify Discord
        if: always() && steps.msg.outputs.category != ''
        env:
          CATEGORY: ${{ steps.msg.outputs.category }}
          FAILURES: ${{ steps.msg.outputs.failures }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          jq -n \
            --arg content "[ALERT] **NSYSU 爬蟲監控異常**

          $CATEGORY

          **失敗項目：**
          \`\`\`
          $FAILURES
          \`\`\`

          [查看執行紀錄](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
            '{content: $content}' | \
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d @-

      - name: Fail workflow on test failure
        if: steps.test_live.outputs.exit_code != '0' || steps.test_anon.outputs.exit_code != '0'
        run: exit 1
